# The Transit public key is supplied to `evidencectl target new`; no local
# signing key is generated or retained. The TLS gateway and its private CA are
# operator bindings, while the governed endpoints stay fixed and reviewable.
formatVersion: 1
governance:
  version: 1
  assuranceProfile: production
  service:
    providerId: https://127.0.0.1:8445
    publicOrigin: https://127.0.0.1:8445
    trustDomain: urn:example:trust:agriculture-pilot
  issuer:
    id: urn:example:issuer:agriculture-holding-evidence
  publication:
    serviceId: urn:example:service:agriculture-holding-evidence
    title: Synthetic agricultural holding evidence
    description: Minimum-disclosure synthetic holding registration evidence
    endpointUrl: https://127.0.0.1:8445
    jurisdictions: [urn:example:jurisdiction:synthetic]
  authentication:
    oidc:
      issuer: https://127.0.0.1:8443
      audience: urn:example:audience:agriculture-pilot
      tokenTypes: [at+jwt]
      algorithms: [RS256]
      jwksSource:
        kind: uri
        uri: https://127.0.0.1:8443/oauth2/jwks
      tlsTrustProfile: pilot-ca
      principalClaim: sub
      requesterTagsClaim: evidence_tags
      evidenceAudienceClaim: evidence_audience
      maximumTokenLifetimeSeconds: 300
      revokedKeyIds: []
  audit:
    hashKeyRef: secret:file/audit-hmac-key
    hashKeyVersion: 1
  subjectBinding:
    secretRef: secret:file/subject-binding-hmac-key
    keyVersion: 1
  rateLimits:
    requestsPerPrincipalPerMinute: 60
    burstPerPrincipal: 10
    failedSelectorAttemptsPerPrincipalAuthorityPerMinute: 10
  signing:
    format: flattened-jws-json
    algorithm: ES256
    publishedPublicJwkFiles: []
    revokedKeyIds: []
    jwksPath: /.well-known/evidence/jwks.json
    maximumAssertionValiditySeconds: 300
    verifierClockSkewSeconds: 30
  responseFormats: [signed-jws]
  sourceConnections:
    registry:
      baseUrl: https://127.0.0.1:8444
      tlsTrustProfile: pilot-ca
      authentication:
        kind: oauth2-client-credentials
        tokenEndpoint: https://127.0.0.1:8443/oauth2/token
        clientIdRef: secret:file/registry-client-id
        clientAssertionKeyRef: secret:file/registry-client-key
        clientAssertionAudience: https://127.0.0.1:8443
        resource: urn:example:audience:agriculture-pilot
        scope: pilot:evidence-source
        maximumCacheSeconds: 60
      concurrencyLimit: 4
      admissionTimeoutMilliseconds: 5000
      tokenTimeoutMilliseconds: 5000
  authorityProfiles:
    holding-verifier:
      kind: explicit-request
      requesterTags: [holding-verifier]
      grants:
        - requirement: urn:example:requirement:holding-registered:v1
          purpose: holding-verification
          audienceFrom: authenticated-requester
          responseFormats: [signed-jws]
          subjects:
            - role: subject
              selectorProfile: breg-8-registry-4-farm-19-by-local-identifier
              valueOrigin: request
runtime:
  apiVersion: registry.registrystack.org/evidence-runtime/v1alpha1
  kind: EvidenceRuntimeConfig
  package:
    root: /config/evidence/candidate
  listener:
    bind: 127.0.0.1:8080
    tlsTermination: operator-controlled-upstream
    trustProxyIdentityHeaders: false
    maximumRequestBytes: 65536
    maximumConcurrentRequests: 64
    requestTimeoutMilliseconds: 10000
    shutdownGraceMilliseconds: 30000
  secretProviders:
    file:
      root: /config/evidence/secrets
  signer:
    kind: transit
    unixSocketPath: /run/registry-evidence/transit-proxy.sock
    mount: transit
    keyName: evidence-signing
    keyVersion: 1
    timeoutMilliseconds: 2000
  audit:
    path: /var/lib/registry-evidence/evidence.jsonl
  outboundTls:
    systemRoots: true
    trustProfiles:
      pilot-ca:
        caBundleFile: /config/evidence/tls/pilot-ca.pem
publicKeys: {}
