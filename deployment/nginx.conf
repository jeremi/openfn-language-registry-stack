pid /tmp/nginx.pid;
error_log stderr notice;

events {}

http {
  access_log off;
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /etc/pilot-tls/server.crt;
  ssl_certificate_key /etc/pilot-tls/server.key;

  # Docker publishes the namespace's network interface, while native services
  # bind loopback. Separate development listeners bridge those host-only ports.
  server {
    listen 8095;
    location / { proxy_pass http://127.0.0.1:8090; }
  }

  server {
    listen 8096;
    location / { proxy_pass http://127.0.0.1:8092; }
  }

  server {
    listen 8097;
    location / { proxy_pass http://127.0.0.1:8081; }
  }

  server {
    listen 8443 ssl;
    location / {
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://127.0.0.1:8091;
    }
  }

  server {
    listen 8444 ssl;
    location / {
      proxy_set_header Host 127.0.0.1:8444;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://127.0.0.1:8090;
    }
  }

  server {
    listen 8445 ssl;
    location / {
      proxy_set_header Host 127.0.0.1:8445;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://127.0.0.1:8080;
    }
  }
}
